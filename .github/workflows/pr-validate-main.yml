name: PR Validation (main)

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate PR to main
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Ensure PR comes from develop
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "ERROR: Only 'develop' can be merged into 'main'."
            exit 1
          fi

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Entra.EventHandlers.slnx

      - name: Build
        run: dotnet build Entra.EventHandlers.slnx -c Release --no-restore

      - name: Run Unit Tests
        run: dotnet test Entra.EventHandlers.slnx -c Release --no-build --verbosity normal
