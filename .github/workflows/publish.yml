name: Publish NuGets

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore
       
      - name: Build Abstractions
        run: dotnet build abstractions/Entra.EventHandlers.Abstractions/Entra.EventHandlers.Abstractions.csproj -c Release --no-restore

      - name: Build Core
        run: dotnet build core/Entra.EventHandlers/Entra.EventHandlers.csproj -c Pack --no-restore

      - name: Run Abstractions Unit Tests
        run: dotnet test abstractions/Entra.EventHandlers.Abstractions.UnitTests/Entra.EventHandlers.Abstractions.UnitTests.csproj --configuration Release --no-build --verbosity normal

      - name: Run Core Unit Tests
        run: dotnet test core/Entra.EventHandlers.UnitTests/Entra.EventHandlers.UnitTests.csproj --configuration Release --no-build --verbosity normal

      - name: Pack Abstractions
        run: dotnet pack abstractions/Entra.EventHandlers.Abstractions/Entra.EventHandlers.Abstractions.csproj -c Release --no-build

      - name: Pack Core
        run: dotnet pack core/Entra.EventHandlers/Entra.EventHandlers.csproj -c Pack --no-build
    
      - name: Publish to NuGet
        run: dotnet nuget push "**/bin/Pack/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate