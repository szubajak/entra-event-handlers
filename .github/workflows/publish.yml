name: Publish NuGets

on:
  push:
    tags:
      - 'Entra.EventHandlers-v*'
      - 'Entra.EventHandlers.Abstractions-v*'
      - 'Entra.EventHandlers.AzureFunctions-v*'
      - 'Entra.EventHandlers.AspNetCore-v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      TAG: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Extract package info
        id: extract
        run: |
          echo "TAG=${TAG}"
          PACKAGE=$(echo "$TAG" | sed -E 's/(.*)-v[0-9]+\.[0-9]+\.[0-9]+/\1/')
          VERSION=$(echo "$TAG" | sed -E 's/.*-v([0-9]+\.[0-9]+\.[0-9]+)/\1/')
          echo "PACKAGE=$PACKAGE" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Detected PACKAGE=$PACKAGE VERSION=$VERSION"

      - name: Restore
        run: dotnet restore Entra.EventHandlers.sln

      - name: Build
        run: dotnet build Entra.EventHandlers.sln -c Release --no-restore

      - name: Run Unit Tests
        run: dotnet test Entra.EventHandlers.sln -c Release --no-build --verbosity normal

      - name: Resolve project path
        id: resolve
        run: |
          case "$PACKAGE" in
            Entra.EventHandlers)
              PROJECT_PATH="core/Entra.EventHandlers/Entra.EventHandlers.csproj"
              ;;
            Entra.EventHandlers.Abstractions)
              PROJECT_PATH="abstractions/Entra.EventHandlers.Abstractions/Entra.EventHandlers.Abstractions.csproj"
              ;;
            Entra.EventHandlers.AzureFunctions)
              PROJECT_PATH="azurefunctions/Entra.EventHandlers.AzureFunctions/Entra.EventHandlers.AzureFunctions.csproj"
              ;;
            Entra.EventHandlers.AspNetCore)
              PROJECT_PATH="aspnetcore/Entra.EventHandlers.AspNetCore/Entra.EventHandlers.AspNetCore.csproj"
              ;;
            *)
              echo "Unknown package: $PACKAGE"
              exit 1
              ;;
          esac

          echo "PROJECT_PATH=$PROJECT_PATH" >> $GITHUB_ENV
          echo "Resolved project path: $PROJECT_PATH"

      - name: Determine pack configuration
        id: packconfig
        run: |
          if grep -q "<Configuration>Pack</Configuration>" "$PROJECT_PATH"; then
            echo "PACK_CONFIG=Pack" >> $GITHUB_ENV
            echo "Using Pack configuration"
          else
            echo "PACK_CONFIG=Release" >> $GITHUB_ENV
            echo "Using Release configuration"
          fi

      - name: Pack selected NuGet
        run: dotnet pack $PROJECT_PATH -c $PACK_CONFIG --no-build -p:PackageVersion=$VERSION

      - name: Publish to NuGet
        run: dotnet nuget push "$(dirname $PROJECT_PATH)/bin/$PACK_CONFIG/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
