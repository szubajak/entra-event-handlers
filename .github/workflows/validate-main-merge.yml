name: Validate main merge source branch

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure PR comes from develop
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "ERROR: Only 'develop' can be merged into 'main'."
            exit 1
          fi
