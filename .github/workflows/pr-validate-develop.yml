name: PR Validation (develop)

on:
  pull_request:
    branches: [ develop ]

jobs:
  validate:
    name: Validate PR to develop
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Entra.EventHandlers.slnx

      - name: Build
        run: dotnet build Entra.EventHandlers.slnx -c Release --no-restore

      - name: Run Unit Tests
        run: dotnet test Entra.EventHandlers.slnx -c Release --no-build --verbosity normal
